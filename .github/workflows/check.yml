name: Checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: First-run from clean checkout
        run: just run
      - name: Verify auth and frontend
        run: |
          test -f .secrets/admin-token
          curl -fsS http://127.0.0.1:8080/ | grep -q EvaDE
          curl -fsS -H "Authorization: Bearer $(cat .secrets/admin-token)" http://127.0.0.1:8000/me | grep -q '"is_admin":true'
      - name: Verify idempotency
        run: |
          before="$(cat .secrets/admin-token)"
          just run
          test "$before" = "$(cat .secrets/admin-token)"
      - name: Cleanup
        if: always()
        run: docker compose down -v || true
