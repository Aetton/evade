[project]
name = "evade-api"
version = "0.1.0"
description = "EvaDE task core"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "cryptography>=43,<48",
  "httpx>=0.27,<1",
  "urllib3>=2.2,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
