services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evade
      POSTGRES_USER: evade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evade"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://evade:${POSTGRES_PASSWORD}@db:5432/evade
      EVADE_CORS_ORIGINS: ${EVADE_CORS_ORIGINS:-http://localhost:1420}
      EVADE_CREDENTIAL_KEY: ${EVADE_CREDENTIAL_KEY:?Set EVADE_CREDENTIAL_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
